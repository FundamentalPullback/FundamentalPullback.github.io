<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Diario de investigación y paper trading del plan Fundamental Pullback.">
<title>Fundamental Pullback Journal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a research ledger. Sticky masthead + section tabs, one working column of tables and decision cards, numbers in mono. */
:root {
  --paper: #F2F4F3;
  --sheet: #FFFFFF;
  --ink: #13202B;
  --ink-2: #4A5A66;
  --rule: #D5DCDF;
  --accent: #B5600B;
  --accent-soft: #F6E7D6;
  --ok: #2E7D4F;   --ok-bg: #DCEFE3;
  --hold: #9A6B00; --hold-bg: #FBEFCB;
  --wait: #2F5F96; --wait-bg: #DDE8F5;
  --watch: #6E4C9A; --watch-bg: #ECE3F6;
  --out: #5E666C;  --out-bg: #E7EAEB;
  --neg: #B3362B;
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E151B; --sheet: #151F27; --ink: #E3E9EC; --ink-2: #9AA9B3; --rule: #27343E;
    --accent: #E39A4C; --accent-soft: #3A2814;
    --ok: #6FCB93; --ok-bg: #173325; --hold: #E6BC4F; --hold-bg: #3A2E0E;
    --wait: #85B2E8; --wait-bg: #182C44; --watch: #BFA0E6; --watch-bg: #2C2140;
    --out: #A3ADB3; --out-bg: #222C33; --neg: #F08A7E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E151B; --sheet: #151F27; --ink: #E3E9EC; --ink-2: #9AA9B3; --rule: #27343E;
  --accent: #E39A4C; --accent-soft: #3A2814;
  --ok: #6FCB93; --ok-bg: #173325; --hold: #E6BC4F; --hold-bg: #3A2E0E;
  --wait: #85B2E8; --wait-bg: #182C44; --watch: #BFA0E6; --watch-bg: #2C2140;
  --out: #A3ADB3; --out-bg: #222C33; --neg: #F08A7E;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  font-variation-settings: "wdth" 100;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet); }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Masthead */
header.mast { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--sheet); border-bottom: 1px solid var(--rule); }
.mast-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px 8px; flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.brand h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; letter-spacing: -0.01em; font-variation-settings: "wdth" 72; text-transform: uppercase; line-height: 1.1; }
.brand h1 span { color: var(--accent); }
.brand p { margin: 0; color: var(--ink-2); font-size: 0.82rem; }
.tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.status { font-family: var(--font-data); font-size: 0.75rem; color: var(--ink-2); }
.btn { font: inherit; font-size: 0.82rem; font-weight: 600; color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
.btn:hover { border-color: var(--ink-2); }
.btn:focus-visible, .tab:focus-visible, .chip:focus-visible, tr.click:focus-visible, select:focus-visible, th button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.lang { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.lang button { font: inherit; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.06em; background: var(--sheet); color: var(--ink-2); border: 0; padding: 6px 9px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
.tab { font: inherit; font-size: 0.86rem; font-weight: 600; white-space: nowrap; background: none; border: 0; border-bottom: 3px solid transparent; color: var(--ink-2); padding: 8px 12px 9px; cursor: pointer; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

main { padding-block: 22px 40px; display: grid; gap: 22px; }
section[hidden] { display: none; }
h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; letter-spacing: -0.01em; font-variation-settings: "wdth" 80; text-wrap: balance; }
h3 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; font-variation-settings: "wdth" 90; }
.lede { margin: 6px 0 0; color: var(--ink-2); max-width: 68ch; }
.eyebrow { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); }
.panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.sec-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }

/* Figures strip */
.figures { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); }
.fig { padding: 14px 16px; display: grid; gap: 2px; border-left: 1px solid var(--rule); min-width: 0; }
.fig:first-child { border-left: 0; }
.fig b { font-family: var(--font-data); font-size: 1.6rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; }
.fig span { font-size: 0.8rem; color: var(--ink-2); }
@media (max-width: 640px) { .figures { grid-template-columns: repeat(2, minmax(0, 1fr)); } .fig:nth-child(3) { border-left: 0; } .fig:nth-child(n+3) { border-top: 1px solid var(--rule); } }

/* Decision distribution */
.dist { display: flex; height: 14px; border-radius: 4px; overflow: hidden; background: var(--out-bg); }
.dist i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.8rem; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

/* Decision pills */
.pill { display: inline-block; font-size: 0.74rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.d-ok { color: var(--ok); background: var(--ok-bg); }
.d-hold { color: var(--hold); background: var(--hold-bg); }
.d-wait { color: var(--wait); background: var(--wait-bg); }
.d-watch { color: var(--watch); background: var(--watch-bg); }
.d-out { color: var(--out); background: var(--out-bg); }
.d-held { color: var(--ink); background: var(--rule); }

/* Candidate cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 14px; }
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 16px; display: grid; gap: 10px; align-content: start; cursor: pointer; text-align: left; font: inherit; color: inherit; }
.card:hover { border-color: var(--ink-2); }
.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.tick { font-family: var(--font-data); font-weight: 600; font-size: 1.2rem; }
.co { font-size: 0.82rem; color: var(--ink-2); }
.card p { margin: 0; font-size: 0.88rem; }
.kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.kv div { display: grid; gap: 0; }
.kv dt { font-size: 0.7rem; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.06em; }
.kv dd { margin: 0; font-family: var(--font-data); font-variant-numeric: tabular-nums; font-size: 0.95rem; }
.band-wrap { position: relative; width: 100%; aspect-ratio: 300 / 64; min-height: 0; }
.band { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
.band text { font-family: var(--font-data); font-size: 9px; fill: var(--ink-2); }
.band .lbl-price { fill: var(--ink); font-weight: 600; }
.band .cap { font-family: var(--font-body); font-size: 8px; }
.card .kv { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; }
.kv dd[data-calc], .dr-key b[data-calc] { cursor: pointer; text-decoration: underline dotted var(--ink-2); text-underline-offset: 4px; text-decoration-thickness: 1px; }
.calc-btn { justify-self: start; display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 0.82rem; font-weight: 600; color: var(--accent); background: transparent; border: 1px solid var(--accent); border-radius: 999px; padding: 6px 12px; cursor: pointer; min-height: 34px; }
.exec { font-size: 0.85rem; padding: 8px 10px; border-radius: 6px; border-left: 3px solid var(--hold); background: var(--hold-bg); }
.exec-neg { border-left-color: var(--neg); background: var(--out-bg); }
.exec b { font-weight: 700; }
.pos-card { cursor: default; }
.pos-card:hover { border-color: var(--rule); }
.pos-card .dr-list dd { font-size: 0.92rem; }
.pos-sl { display: grid; grid-template-columns: auto 1fr; align-items: baseline; gap: 2px 12px; background: var(--paper); border-left: 4px solid var(--neg); border-radius: 8px; padding: 10px 12px; }
.pos-sl span { font-size: 0.74rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--neg); }
.pos-sl b { font-family: var(--font-data); font-size: 1.25rem; font-variant-numeric: tabular-nums; justify-self: end; }
.pos-sl small { grid-column: 1 / -1; font-size: 0.8rem; color: var(--ink-2); }
.pos-val { border-top: 1px solid var(--rule); padding-top: 10px; display: grid; gap: 8px; }
.calc-btn:hover { background: var(--accent-soft); }
.calc-btn i { font-style: normal; display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; background: var(--accent); color: var(--sheet); font-family: Georgia, serif; font-weight: 700; font-size: 0.75rem; }
.calc-scrim { position: fixed; inset: 0; z-index: 30; background: rgba(10, 16, 22, 0.5); display: flex; align-items: flex-end; justify-content: center; }
.calc-sheet { width: min(620px, 100%); max-height: 86vh; overflow-y: auto; background: var(--sheet); border: 1px solid var(--rule); border-bottom: 0; border-radius: 16px 16px 0 0; padding: 0 18px calc(22px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; align-content: start; animation: calcUp 0.22s ease-out; }
@keyframes calcUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .calc-sheet { animation: none; } }
@media (min-width: 720px) { .calc-scrim { align-items: center; } .calc-sheet { border-radius: 14px; border-bottom: 1px solid var(--rule); } }
.calc-grab { width: 40px; height: 4px; border-radius: 2px; background: var(--rule); margin: 0 auto 10px; }
.calc-top { position: sticky; top: 0; z-index: 1; background: var(--sheet); padding: 10px 0 10px; border-bottom: 1px solid var(--rule); }
.calc-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.calc-head h3 { margin: 0; font-size: 1.05rem; }
.calc-sec { border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; scroll-margin-top: 64px; transition: border-color 0.3s, background 0.3s; }
.calc-sec.hl { border-color: var(--accent); background: var(--accent-soft); }
.calc-sec header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.calc-sec header span { font-size: 0.72rem; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.06em; }
.calc-sec header b { font-family: var(--font-data); font-variant-numeric: tabular-nums; font-size: 1.1rem; white-space: nowrap; }
.calc-sec p { margin: 0; font-size: 0.86rem; color: var(--ink-2); line-height: 1.45; }
.calc-f { font-family: var(--font-data); font-variant-numeric: tabular-nums; font-size: 0.84rem; background: var(--paper); border-radius: 6px; padding: 8px 10px; overflow-wrap: anywhere; color: var(--ink); }
.calc-src { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 14px; margin: 2px 0 0; }
.calc-src div { display: flex; justify-content: space-between; gap: 8px; font-size: 0.82rem; border-bottom: 1px dashed var(--rule); padding-bottom: 3px; }
.calc-src dt { color: var(--ink-2); } .calc-src dd { margin: 0; font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.calc-note { font-size: 0.8rem !important; font-style: italic; }
.calc-list { list-style: none; margin: 0; padding: 0; display: grid; font-size: 0.86rem; line-height: 1.45; }
.calc-list li { padding: 7px 0 7px 14px; border-top: 1px solid var(--rule); position: relative; }
.calc-list li::before { content: ""; position: absolute; left: 2px; top: 15px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }

/* Controls */
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { font: inherit; font-size: 0.8rem; font-weight: 600; background: var(--sheet); color: var(--ink-2); border: 1px solid var(--rule); border-radius: 999px; padding: 4px 11px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
select, input[type="search"] { font: inherit; font-size: 0.85rem; color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 8px; }
label.inline { display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--ink-2); }

/* Tables */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); }
.tbl-outer { position: relative; min-width: 0; }
.tbl-outer::after { content: ""; position: absolute; top: 1px; right: 1px; bottom: 1px; width: 36px; border-radius: 0 8px 8px 0; pointer-events: none; background: linear-gradient(to right, transparent, var(--sheet)); opacity: 0; transition: opacity 0.2s; }
.tbl-outer.more::after { opacity: 1; }
.tbl-wrap td:first-child, .tbl-wrap th:first-child { position: sticky; left: 0; z-index: 1; background: var(--sheet); box-shadow: 1px 0 0 var(--rule); }
.tbl-wrap th:first-child { z-index: 2; }
tr.click:hover td:first-child { background: var(--paper); }
.s2chart { display: flex; align-items: flex-end; gap: 3px; height: 130px; }
.s2bar { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 3px; background: none; border: 0; padding: 0; cursor: pointer; font: inherit; }
.s2bar i { display: block; width: 100%; max-width: 28px; background: var(--s1); opacity: 0.45; border-radius: 4px 4px 0 0; }
.s2bar em { font-style: normal; font-family: var(--font-data); font-size: 0.68rem; color: var(--ink-2); order: -1; }
.s2bar.on i { background: var(--accent); opacity: 1; } .s2bar.on em { color: var(--ink); font-weight: 600; }
.s2bar:hover i { opacity: 0.8; } .s2bar:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.s2axis { display: flex; justify-content: space-between; font-family: var(--font-data); font-size: 0.72rem; color: var(--ink-2); }
@media (max-width: 640px) { .s2bar em { display: none; } }
table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: top; }
th { position: sticky; top: 0; background: var(--sheet); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); white-space: nowrap; }
th button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-transform: inherit; letter-spacing: inherit; }
th button[data-dir="asc"]::after { content: " \2191"; }
th button[data-dir="desc"]::after { content: " \2193"; }
td.n, th.n { text-align: right; font-family: var(--font-data); font-variant-numeric: tabular-nums; white-space: nowrap; }
td.t { font-family: var(--font-data); font-weight: 600; white-space: nowrap; }
td.why { min-width: 260px; max-width: 520px; color: var(--ink-2); }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--paper); }
.neg { color: var(--neg); }
.pos { color: var(--ok); }
.acct-note { margin: -6px 0 0; font-size: 0.8rem; color: var(--ink-2); max-width: 90ch; }
.fig small { font-family: var(--font-data); font-variant-numeric: tabular-nums; font-size: 0.85rem; color: var(--ink-2); }
.fig small.pos { color: var(--ok); } .fig small.neg { color: var(--neg); }
.plbars { display: grid; gap: 6px; }
.plrow { display: grid; grid-template-columns: 56px minmax(0, 1fr) 68px; align-items: center; gap: 8px; font-size: 0.85rem; }
.plrow .t { font-weight: 600; }
.plrow .v { text-align: right; font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.pltrack { position: relative; height: 14px; }
.pltrack::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--rule); }
.plbar { position: absolute; top: 2px; height: 10px; border-radius: 2px; }
.stats { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 12px; }
.viz { --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948; --cashc: #C9D1D5; }
@media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) .viz { --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767; --cashc: #3A4852; } }
:root[data-theme="dark"] .viz { --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767; --cashc: #3A4852; }
.hero { position: relative; background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 20px 20px 12px; display: grid; gap: 12px; overflow: hidden; }
.hero::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: linear-gradient(90deg, var(--s1), var(--s3), var(--accent)); }
.hero-top { display: flex; justify-content: space-between; gap: 18px; flex-wrap: wrap; align-items: flex-end; }
.hero-num { font-family: var(--font-data); font-weight: 600; font-size: clamp(2rem, 7vw, 3.1rem); line-height: 1.05; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.hero-num .cur { font-size: 0.5em; color: var(--ink-2); }
.hero-sub { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin-top: 8px; font-size: 0.85rem; }
.tag { font-family: var(--font-data); font-weight: 600; font-size: 0.88rem; padding: 3px 10px; border-radius: 999px; }
.tag-pos { color: var(--ok); background: var(--ok-bg); } .tag-neg { color: var(--neg); background: var(--out-bg); }
.hero-side { display: flex; gap: 10px; }
.hero-side > div { display: grid; gap: 1px; padding: 10px 14px; border-radius: 8px; background: var(--paper); min-width: 128px; }
.hero-side b { font-family: var(--font-data); font-size: 1.25rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.hero-side small { font-family: var(--font-data); font-size: 0.8rem; color: var(--ink-2); }
.hero-side small.pos { color: var(--ok); } .hero-side small.neg { color: var(--neg); }
@media (max-width: 640px) { .hero-side { width: 100%; } .hero-side > div { flex: 1; min-width: 0; } }
.eqchart { width: 100%; position: relative; touch-action: pan-y; }
.eqchart svg { display: block; }
.eqchart .grid { stroke: var(--rule); stroke-width: 1; }
.eqchart .axis { font-family: var(--font-data); font-size: 11px; fill: var(--ink-2); }
.eqchart .xhair { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 2 2; }
.eq-legend i.ln { width: 16px; height: 3px; border-radius: 2px; }
.eq-legend i.dash { background: repeating-linear-gradient(90deg, var(--ink-2) 0 4px, transparent 4px 7px); }
.tip { position: absolute; z-index: 3; pointer-events: none; background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; font-size: 0.8rem; box-shadow: 0 6px 18px rgba(0,0,0,0.12); display: grid; gap: 3px; white-space: nowrap; }
.tip[hidden] { display: none; }
.tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }
.tip .n { font-family: var(--font-data); margin-left: 6px; }
.duo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 820px) { .duo { grid-template-columns: minmax(0, 1fr); } }

  }

  /* ---------- render ---------- */
  function renderChrome() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(function (el) { var k = el.getAttribute("data-i18n"); if (t()[k]) el.textContent = t()[k]; });
    document.getElementById("lang-es").setAttribute("aria-pressed", lang === "es");
    document.getElementById("lang-en").setAttribute("aria-pressed", lang === "en");
    var tabs = document.getElementById("tabs");
    tabs.innerHTML = VIEWS.map(function (v) {
      return '<button class="tab" role="tab" type="button" id="tab-' + v + '" data-view="' + v + '" aria-controls="v-' + v + '" aria-selected="' + (S.view === v) + '">' + esc(t().tabs[v]) + "</button>";
    }).join("");
    var st = document.getElementById("status");
    if (S.snapshot) st.textContent = t().asOf + " " + fmtD(S.snapshot);
    else if (S.loadedAt) st.textContent = t().updated + " · " + new Intl.DateTimeFormat(loc(), { hour: "2-digit", minute: "2-digit" }).format(new Date(S.loadedAt));
    else st.textContent = S.err.dec || S.err.scan ? "" : t().loading;
  }
  var RENDER = { posiciones: vPosiciones, resumen: vResumen, escaner: vEscaner, analisis: vAnalisis, aprobadas: vAprobadas, descartadas: vDescartadas, operaciones: vOperaciones, cartera: vCartera, rendimiento: vRendimiento, retro: vRetro, biblioteca: vBiblioteca };
  /* fade on the right edge of a table while there are more columns to scroll to */
  function markScroll(root) {
    [].forEach.call(root.querySelectorAll(".tbl-outer"), function (o) {
      var w = o.firstElementChild; if (!w) return;
      function upd() { o.classList.toggle("more", w.scrollLeft + w.clientWidth < w.scrollWidth - 2); }
      upd(); w.addEventListener("scroll", upd, { passive: true });
    });
  }
  window.addEventListener("resize", function () { var el = document.getElementById("v-" + S.view); if (el) markScroll(el); });
  function render() {
    renderChrome();
    VIEWS.forEach(function (v) {
      var el = document.getElementById("v-" + v);
      el.hidden = v !== S.view;
      if (v === S.view) {
        var focusId = document.activeElement && document.activeElement.id;
        var lf = S.loadFail && S.loadFail.length ? notice(t().loadFail, S.loadFail.join(", "), '<p><button class="btn" type="button" data-retry="1">' + esc(t().retry) + "</button></p>") : "";
        el.innerHTML = '<div style="display:grid;gap:16px">' + lf + RENDER[v]() + "</div>";
        if (v === "cartera") drawEquity();
        markScroll(el);
        if (focusId === "scan-q" || focusId === "lib-q" || focusId === "rej-q" || focusId === "ana-q") { var q = document.getElementById(focusId); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }
      }
    });
  }

  /* ---------- events ---------- */
  document.addEventListener("click", function (e) {
    var tab = e.target.closest("[data-view]");
    if (tab) { go(tab.getAttribute("data-view")); return; }
    var s = e.target.closest("[data-sort]");
    if (s) { var p = s.getAttribute("data-sort").split("|"); var cur = S.sort[p[0]]; S.sort[p[0]] = { key: p[1], dir: cur && cur.key === p[1] && cur.dir === "desc" ? "asc" : "desc" }; render(); return; }
    var ch = e.target.closest("[data-chip]");
    if (ch) {
      var q = ch.getAttribute("data-chip").split("|");
      if (q[0] === "ana") S.anaFilter = q[1]; else if (q[0] === "rej") S.rejFilter = q[1];
      else if (q[0] === "rhz") S.retroHz = q[1]; else if (q[0] === "rgrp") S.retroGrp = q[1]; else if (q[0] === "lcat") S.libCat = q[1];
      render(); return;
    }
    var rd = e.target.closest("[data-resdate]");
    if (rd) { S.resDate = rd.getAttribute("data-resdate"); render(); return; }
    var lo = e.target.closest("[data-libopen]");
    if (lo) { closeDrawer(); S.libSel = lo.getAttribute("data-libopen"); go("biblioteca"); return; }
    var gv = e.target.closest("[data-goview]");
    if (gv) { closeDrawer(); go(gv.getAttribute("data-goview")); return; }
    var lq = e.target.closest("[data-libq]");
    if (lq) { closeDrawer(); S.libSel = null; S.libQ = lq.getAttribute("data-libq"); S.libCat = "all"; go("biblioteca"); return; }
    if (e.target.closest("[data-retry]")) { location.reload(); return; }
    if (e.target.closest("[data-libretry]")) { S.libState = "idle"; render(); return; }
    if (e.target.id === "lib-back") { S.libSel = null; render(); window.scrollTo(0, 0); return; }
    if (e.target.id === "latest-only") { S.latestOnly = !S.latestOnly; render(); return; }
    var cc = e.target.closest("[data-calc]");
    if (cc) { openCalc(cc.getAttribute("data-calc")); return; }
    var op = e.target.closest("[data-open]");
    if (op) { openDetail(op.getAttribute("data-open")); return; }
    if (e.target.id === "only-s2") { S.onlyS2 = !S.onlyS2; render(); return; }
    if (e.target.closest("[data-allow]")) { loadOnce(); return; }
  });
  document.addEventListener("keydown", function (e) {
    if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("tr.click, .plrow.click, div.card")) { e.preventDefault(); openDetail(e.target.getAttribute("data-open")); }
  });
  document.addEventListener("change", function (e) { if (e.target.id === "scan-date") { S.scanDate = e.target.value; render(); } if (e.target.id === "res-date") { S.resDate = e.target.value; render(); } if (e.target.id === "ana-date") { S.anaDate = e.target.value; S.anaFilter = "all"; render(); } });
  var libT;
  document.addEventListener("input", function (e) {
    if (e.target.id === "scan-q") { S.scanQ = e.target.value; render(); }
    if (e.target.id === "rej-q" || e.target.id === "ana-q") { S[e.target.id === "rej-q" ? "rejQ" : "anaQ"] = e.target.value; clearTimeout(libT); libT = setTimeout(render, 150); }
    if (e.target.id === "lib-q") { S.libQ = e.target.value; clearTimeout(libT); libT = setTimeout(render, 180); }
  });
  var rsz; window.addEventListener("resize", function () { clearTimeout(rsz); rsz = setTimeout(function () { if (S.view === "cartera") drawEquity(); }, 120); });
  function setLang(l) { lang = l; try { localStorage.setItem("fpj-lang", l); } catch (e) {} render(); }
  document.getElementById("lang-es").addEventListener("click", function () { setLang("es"); });
  document.getElementById("lang-en").addEventListener("click", function () { setLang("en"); });

  var hash = (location.hash || "").replace("#", "");
  if (VIEWS.indexOf(hash) >= 0) S.view = hash;
  function go(v) {
    if (VIEWS.indexOf(v) < 0) return;
    if (location.hash !== "#" + v) { location.hash = v; return; }   /* hashchange renders */
    S.view = v; render(); window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", function () {
    var v = (location.hash || "").replace("#", "");
    if (VIEWS.indexOf(v) < 0) return;
    closeDrawer(); S.view = v; render(); window.scrollTo(0, 0);
  });

  /* ---------- data loading ---------- */
  var mcpNS = null;
  var PARTS = {
    scan: function (v) { return fullNames(numify(rowsToObjects(v, SCAN_MAP), NUM_SCAN)); },
    dec: function (v) { return fullNames(numify(rowsToObjects(v, DEC_MAP), NUM_DEC)); },
    ops: function (v) { return numify(rowsToObjects(v, OPS_MAP), NUM_OPS); },
    ges: function (v) { return numify(rowsToObjects(v, GES_MAP), ["stop", "m"]).map(function (r) { r.trailN = num(r.trail); return r; }); },
    retro: function (v) { return numify(rowsToObjects(v, RETRO_MAP), NUM_RETRO).map(function (r) { r.hz = String(r.hz); return r; }); },
    acct: function (v) {
      var a = { capital: null, spy0: null, spy: null, prices: {} };
      (v || []).slice(1).forEach(function (r) {
        var k = String(r[0] || "").trim(), val = num(r[1]);
        if (k === "Capital inicial") a.capital = val;
        else if (k === "SPY al inicio") a.spy0 = val;
        else if (k === "SPY actual") a.spy = val;
        else if (k === "Fecha de inicio") a.start = String(r[1] || "");
        else if (k === "Nota") a.note = String(r[1] || "");
        else if (k === "Nota (EN)") a.noteEn = String(r[1] || "");
        var tk = String(r[3] || "").trim();
        if (tk) a.prices[tk] = { p: num(r[4]), prev: num(r[5]) };
      });
      return a;
    },
    hist: function (v) {
      var out = {};
      if (!v || v.length < 3) return out;
      for (var c = 0; c < v[0].length; c += 2) {
        var tk = String(v[0][c] || "").trim(); if (!tk) continue;
        var m = {};
        for (var i = 2; i < v.length; i++) {
          var r = v[i] || [], ser = num(r[c]), cl = num(r[c + 1]);
          if (ser === null || cl === null) continue;
          var d = new Date(Date.UTC(1899, 11, 30) + Math.floor(ser) * 86400000);
          m[d.toISOString().slice(0, 10)] = cl;
        }
        out[tk] = m;
      }
      return out;
    }
  };
  var DENY = ["needs_reauth", "server_not_connected", "blocked_by_policy", "approval_required", "not_in_manifest", "selection_required"];
  function payloadValues(result) {
    var p = result && result.payload;
    if (p && typeof p === "object" && Array.isArray(p.values)) return p.values;
    if (p && typeof p === "object" && !p.values) return [];
    return null;
  }
  function accept(part, result) {
    var vals = payloadValues(result);
    if (vals === null) { S.err[part] = { code: "tool_error", message: "" }; render(); return; }
    S[part] = PARTS[part](vals);
    S.err[part] = null;
    S.loadedAt = result.cache && result.cache.storedAt ? result.cache.storedAt : Date.now();
    render();
  }
  function fail(part, err) {
    var code = err && err.code ? err.code : "upstream_error";
    if (DENY.indexOf(code) >= 0) S[part] = null;
    if (S[part] === null || code === "tool_error") S.err[part] = { code: code, message: err && err.message };
    else S.err[part] = null;
    render();
  }
  var unsub = [];
  function watchAll() {
    unsub.forEach(function (u) { try { u(); } catch (e) {} });
    unsub = Object.keys(RANGES).map(function (part) {
      return mcpNS.watchTool(SERVER, TOOL, { spreadsheetId: SHEET_ID, range: RANGES[part] }, function (ev) {
        if (ev.type === "data") accept(part, ev.result); else fail(part, ev.error);
      }, { cache: { staleTime: 60000, gcTime: 86400000 }, refetchInterval: 300000 });
    });
  }
  function loadOnce() {
    if (!mcpNS) return;
    Object.keys(RANGES).forEach(function (part) {
      mcpNS.callTool(SERVER, TOOL, { spreadsheetId: SHEET_ID, range: RANGES[part] }, { cache: { staleTime: 0, gcTime: 86400000, refresh: true } })
        .then(function (r) { accept(part, r); }, function (e) { fail(part, e); });
    });
  }
  document.getElementById("refresh").addEventListener("click", function () {
    if (!mcpNS) return;
    mcpNS.invalidate(SERVER, TOOL).catch(function () {}).then(loadOnce);
  });


  /* ---------- disclaimer gate (public snapshot only) ---------- */
  var GATE_KEY = "fpj-disclaimer-v1", GATE_DAYS = 1;
  function gateAccepted() { try { var v = +localStorage.getItem(GATE_KEY); return v && Date.now() - v < GATE_DAYS * 86400000; } catch (e) { return false; } }
  function showGate(declined) {
    var root = document.getElementById("gate-root");
    if (!root) { root = document.createElement("div"); root.id = "gate-root"; document.body.appendChild(root); }
    ["main", "header.mast", "footer"].forEach(function (q) { var el = document.querySelector(q); if (el) el.setAttribute("inert", ""); });
    var body = declined
      ? '<div class="lang-block"><span class="tag-l">ES</span><h2>No puedes acceder sin aceptar el aviso</h2><p>Esta web solo se muestra a quien acepta que su contenido es informativo y no es asesoramiento de inversión.</p></div>' +
        '<div class="lang-block"><span class="tag-l">EN</span><h2>You can\'t enter without accepting the notice</h2><p>This site is only shown to visitors who accept that its content is informational and not investment advice.</p></div>' +
        '<div class="gate-actions"><button class="btn" type="button" id="gate-back">Volver al aviso · Back to the notice</button></div>'
      : '<div class="lang-block"><span class="tag-l">ES</span><h2 id="gate-t">Aviso importante</h2><p>Esta web es un diario personal de <strong>paper trading</strong>: operaciones simuladas, sin dinero real. Su único objetivo es informativo y educativo.</p><p><strong>No es asesoramiento de inversión</strong> ni una recomendación de comprar o vender ningún valor. Los datos y análisis pueden contener errores o estar desactualizados. Cualquier decisión de inversión es solo tuya; si la necesitas, consulta a un asesor financiero autorizado.</p></div>' +
        '<div class="lang-block"><span class="tag-l">EN</span><h2>Important notice</h2><p>This site is a personal <strong>paper-trading</strong> journal: simulated trades, no real money. It is for informational and educational purposes only.</p><p><strong>It is not investment advice</strong> or a recommendation to buy or sell any security. The data and analysis may contain errors or be out of date. Any investment decision is yours alone; if you need advice, consult a licensed financial advisor.</p></div>' +
        '<div class="gate-actions"><button class="btn btn-primary" type="button" id="gate-yes">Acepto y entro · I agree, enter</button><button class="btn" type="button" id="gate-no">No acepto · I don\'t agree</button></div>';
    root.innerHTML = '<div class="gate" role="dialog" aria-modal="true" aria-labelledby="gate-t"><div class="gate-box">' + body + "</div></div>";
    document.documentElement.style.overflow = "hidden";
    var first = root.querySelector("button"); if (first) first.focus();
    var yes = document.getElementById("gate-yes"), no = document.getElementById("gate-no"), back = document.getElementById("gate-back");
    if (yes) yes.addEventListener("click", function () {
      try { localStorage.setItem(GATE_KEY, String(Date.now())); } catch (e) {}
      root.innerHTML = ""; document.documentElement.style.overflow = "";
      ["main", "header.mast", "footer"].forEach(function (q) { var el = document.querySelector(q); if (el) el.removeAttribute("inert"); });
    });
    if (no) no.addEventListener("click", function () { showGate(true); });
    if (back) back.addEventListener("click", function () { showGate(false); });
  }
  if (window.FP_MANIFEST && !gateAccepted()) showGate(false);
  render();
  function loadScript(src) { return new Promise(function (ok, ko) { var el = document.createElement("script"); el.src = src; el.onload = ok; el.onerror = function () { ko(src); }; document.head.appendChild(el); }); }
  if (window.FP_MANIFEST) {
    var MF = window.FP_MANIFEST;
    document.getElementById("refresh").hidden = true;
    var foot = document.querySelector("footer .wrap"); if (foot) { var sn = document.createElement("div"); sn.setAttribute("data-i18n", "snapNote"); sn.style.marginTop = "6px"; foot.parentNode.appendChild(sn); sn.className = "wrap"; }
    var failed = [];
    MF.files.reduce(function (pr, f) { return pr.then(function () { return loadScript(f).catch(function () { failed.push(f); }); }); }, Promise.resolve()).then(function () {
      S.loadFail = failed;
      var F = window.FP || {};
      S.scan = PARTS.scan([F.scanHead || []].concat(F.scan || []));
      S.dec = PARTS.dec(F.dec || []); S.ops = PARTS.ops(F.ops || []); S.acct = PARTS.acct(F.acct || []); S.hist = PARTS.hist(F.hist || []); S.retro = PARTS.retro(F.retro || []); S.ges = PARTS.ges(F.ges || []);
      S.snapshot = MF.asOf; S.loadedAt = Date.parse(MF.generated) || Date.now();
      render();
      prefetchLib();
      loadLive(); setInterval(loadLive, LIVE_EVERY);
      document.addEventListener("visibilitychange", function () { if (!document.hidden) loadLive(); });
    }, function () { ["scan", "dec", "ops", "acct"].forEach(function (p) { S.err[p] = { code: "generic" }; }); render(); });
  } else if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("mcp").then(function (ns) {
      if (!ns) { ["scan", "dec", "ops", "acct", "hist", "retro"].forEach(function (p) { S.err[p] = { code: "none" }; }); render(); return; }
      mcpNS = ns;
      watchAll();
      prefetchLib();
    }, function () { ["scan", "dec", "ops", "acct", "hist", "retro"].forEach(function (p) { S.err[p] = { code: "none" }; }); render(); });
  } else {
    ["scan", "dec", "ops", "acct", "hist", "retro"].forEach(function (p) { S.err[p] = { code: "none" }; });
    render();
  }
})();
</script>
